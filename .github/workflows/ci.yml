name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The suite is fully mock-based: no databases and no torch needed.
      # sentence_transformers is stubbed by conftest when absent.
      - name: Install test dependencies
        run: |
          pip install fastapi pydantic-settings sqlalchemy asyncpg neo4j \
            qdrant-client redis openai tiktoken httpx uvicorn python-dotenv \
            prometheus-fastapi-instrumentator numpy \
            pytest pytest-asyncio pytest-cov faker factory_boy mypy

      # No --ignore-missing-imports: it used to hide the fact that mypy
      # could not resolve a single intra-project import (the app roots them
      # at src/, mypy named them src.*), typed them all as Any and checked
      # nothing across module boundaries. pyproject sets mypy_path and
      # names the few third-party packages that genuinely lack stubs.
      - name: Type check (strict)
        run: mypy src config

      - name: Tests
        run: pytest src/tests -q
